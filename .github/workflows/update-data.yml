name: Update data and deploy

on:
  schedule:
    # Daily at 16:47 UTC, after the ECB publishes its reference rates (around 16:00 CET).
    # An unusual minute, as GitHub recommends: scheduled runs are delayed most at busy
    # times such as the full and half hour.
    - cron: "47 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # Always start from the latest main, not the commit that triggered the run: a re-run
      # of a failed run would otherwise build on outdated data and its push be rejected.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1

      - name: Fetch data
        run: Rscript R/update_data.R

      # Keep the data in the repository: it is the fallback when a source is down, and
      # gives a history of every refresh. Pushes made with GITHUB_TOKEN do not re-trigger
      # this workflow.
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update data $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      # GitHub occasionally fails to find the site artifact that was just uploaded
      # ("No artifacts named github-pages were found"); wait a minute and try once more.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying the deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
